<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CTerm Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: VS Code-style workbench. Explorer | Editor | Preview | two stacked shells, each split draggable.
   Single black theme by request: no light mode, true black ground, one amber accent. */
:root {
  --bg: #000000;
  --panel: #07090c;
  --panel-2: #0b0e13;
  --raise: #161b23;
  --line: #1e242e;
  --fg: #dfe6f0;
  --muted: #828e9f;
  --faint: #4e5868;
  --accent: #f2b54a;
  --accent-ink: #120c00;
  --sky: #8ccfff;
  --ok: #72d49c;
  --err: #ff7d7d;
  --t-k: #c7a0ff; --t-s: #a6da8c; --t-n: #f6ab7c; --t-c: #5f6e86; --t-f: #8ccfff;
  --t-t: #ff9184; --t-a: #f2c27a; --t-y: #74d8cb; --t-h: #f2b54a;
  --a30: #4e5868; --a31: #ff7d7d; --a32: #72d49c; --a33: #f2c55a; --a34: #78b4ff; --a35: #d59bff; --a36: #6fd6e0; --a37: #dfe6f0; --a90: #6b7890;
  --checker: #0f141c;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  --code-size: 13px;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* title bar */
.titlebar { display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 38px; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand svg { width: 18px; height: 18px; flex: none; }
.brand small { font-weight: 400; color: var(--muted); font-family: var(--font-code); font-size: 11px; }
.tb-spacer { flex: 1; }
.chipline { font-family: var(--font-code); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chipline b { color: var(--accent); font-weight: 500; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 26px; border: 0; background: transparent; border-radius: 5px; color: var(--muted); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--raise); color: var(--fg); }
.icon-btn[aria-pressed="true"] { color: var(--fg); background: var(--raise); }
.icon-btn svg { width: 16px; height: 16px; }

/* workbench */
.work { flex: 1; min-height: 0; display: flex; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
.explorer { width: 210px; flex: none; border-right: 1px solid var(--line); }
.p-editor { flex: 1.05 1 0; }
.p-preview { flex: 1 1 0; }
.p-terms { flex: 1.15 1 0; background: var(--bg); }
.split { flex: none; width: 5px; cursor: col-resize; background: var(--line); background-clip: content-box; padding: 0 2px; margin: 0 -2px; position: relative; z-index: 3; }
.split:hover, .split.drag { background: var(--accent); }
.hsplit { flex: none; height: 5px; cursor: row-resize; background: var(--line); background-clip: content-box; padding: 2px 0; margin: -2px 0; position: relative; z-index: 3; }
.hsplit:hover, .hsplit.drag { background: var(--accent); }

.pane-head { display: flex; align-items: stretch; height: 35px; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.pane-label { display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
.head-actions { display: flex; align-items: center; gap: 2px; padding: 0 6px; margin-left: auto; flex: none; }

/* explorer */
.tree { flex: 1; overflow: auto; padding: 4px 0 12px; font-size: 13px; }
.tree-row { display: flex; align-items: center; gap: 6px; height: 24px; padding-right: 8px; cursor: pointer; white-space: nowrap; border: 0; background: none; width: 100%; text-align: left; color: var(--fg); }
.tree-row:hover { background: var(--raise); }
.tree-row.active { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.tree-row .tw { width: 12px; color: var(--muted); flex: none; display: inline-grid; place-items: center; }
.tree-row .nm { overflow: hidden; text-overflow: ellipsis; }

/* file badges */
.badge { flex: none; display: inline-grid; place-items: center; min-width: 20px; height: 15px; padding: 0 3px; border-radius: 3px; font-family: var(--font-code); font-size: 9px; font-weight: 600; letter-spacing: -.02em; color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 15%, transparent); }
.b-html { --c: var(--t-t); } .b-css { --c: var(--a34); } .b-js { --c: var(--a33); } .b-ts { --c: var(--a34); }
.b-md { --c: var(--fg); } .b-ipynb { --c: var(--a35); } .b-py { --c: var(--a32); } .b-c, .b-cpp, .b-h { --c: var(--t-f); }
.b-json { --c: var(--a33); } .b-csv { --c: var(--a32); } .b-svg { --c: var(--t-n); } .b-sql { --c: var(--a36); }
.b-win { --c: var(--a34); }
.b-yaml, .b-yml { --c: var(--t-k); } .b-sh { --c: var(--ok); } .b-dir { --c: var(--sky); }

/* editor tabs */
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 7px; padding: 0 6px 0 12px; border: 0; border-right: 1px solid var(--line); background: var(--panel-2); color: var(--muted); cursor: pointer; white-space: nowrap; height: 100%; position: relative; }
.tab.active { background: var(--bg); color: var(--fg); }
.tab.active::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); }
.tab .x { width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 4px; color: var(--muted); opacity: 0; }
.tab:hover .x, .tab.active .x { opacity: 1; }
.tab .x:hover { background: var(--raise); color: var(--fg); }

.ed-wrap { flex: 1; min-height: 0; display: flex; background: var(--bg); position: relative; }
.gutter { flex: none; min-width: 48px; padding: 10px 12px 10px 8px; text-align: right; font-family: var(--font-code); font-size: var(--code-size); line-height: 1.6; color: var(--faint); overflow: hidden; user-select: none; font-variant-numeric: tabular-nums; }
.gutter .cur { color: var(--fg); }
.gutter-inner { will-change: transform; white-space: pre; }
.ed-area { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.ed-hl, .ed-ta { position: absolute; inset: 0; margin: 0; padding: 10px 16px 40px 4px; font-family: var(--font-code); font-size: var(--code-size); line-height: 1.6; white-space: pre; tab-size: 2; border: 0; letter-spacing: 0; font-variant-ligatures: none; }
.ed-hl { color: var(--fg); pointer-events: none; overflow: hidden; }
.ed-hl-inner { will-change: transform; min-height: 100%; }
.ed-ta { background: transparent; color: transparent; caret-color: var(--accent); resize: none; outline: none; overflow: auto; width: 100%; height: 100%; }
.ed-ta::selection { background: color-mix(in srgb, var(--sky) 30%, transparent); color: transparent; }
.ed-empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; color: var(--muted); padding: 24px; }
.ed-empty code { font-family: var(--font-code); color: var(--accent); }

/* syntax tokens (shared by editor, markdown and notebooks) */
.t-k { color: var(--t-k); } .t-s { color: var(--t-s); } .t-n { color: var(--t-n); } .t-c { color: var(--t-c); font-style: italic; }
.t-f { color: var(--t-f); } .t-t { color: var(--t-t); } .t-a { color: var(--t-a); } .t-y { color: var(--t-y); } .t-h { color: var(--t-h); font-weight: 600; }

/* preview */
.pv-kind { font-family: var(--font-code); font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
.pv-kind b { color: var(--fg); font-weight: 500; }
.pin { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 1px 4px 1px 8px; font-size: 10px; color: var(--accent); text-transform: none; letter-spacing: 0; background: none; cursor: pointer; }
.pv-body { flex: 1; min-height: 0; overflow: auto; position: relative; background: var(--panel-2); }
.pv-body.frame { overflow: hidden; display: flex; flex-direction: column; background: #000; }
.pv-frame { flex: 1; width: 100%; border: 0; background: #000; min-height: 0; color-scheme: light; }
.pv-console { flex: none; max-height: 40%; overflow: auto; background: var(--bg); border-top: 1px solid var(--line); font-family: var(--font-code); font-size: 12px; }
.pv-console.big { max-height: none; flex: 1; }
.pv-console-head { position: sticky; top: 0; display: flex; justify-content: space-between; padding: 5px 12px; font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line); }
.log { padding: 3px 12px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); white-space: pre-wrap; word-break: break-word; color: var(--fg); }
.log.warn { color: var(--a33); } .log.error { color: var(--err); }
.log-empty { padding: 8px 12px; color: var(--faint); }

.doc { max-width: 46rem; margin: 0 auto; padding: 28px 28px 48px; line-height: 1.65; font-size: 14px; }
.doc h1, .doc h2, .doc h3 { line-height: 1.25; text-wrap: balance; margin: 1.4em 0 .5em; }
.doc h1 { font-size: 1.75rem; margin-top: 0; } .doc h2 { font-size: 1.3rem; padding-bottom: .3em; border-bottom: 1px solid var(--line); } .doc h3 { font-size: 1.1rem; }
.doc p, .doc ul, .doc ol, .doc blockquote { margin: 0 0 1em; }
.doc a { color: var(--sky); }
.doc code { font-family: var(--font-code); font-size: .88em; background: var(--raise); padding: .1em .35em; border-radius: 4px; }
.doc pre.code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; }
.doc pre.code code { background: none; padding: 0; font-size: inherit; }
.doc blockquote { border-left: 3px solid var(--accent); padding: 4px 14px; color: var(--muted); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.doc blockquote p { margin: 4px 0; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.doc li.nested { margin-left: 1.5em; }
.doc li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.2em; }
.doc img { max-width: 100%; }
.table-wrap { overflow-x: auto; margin: 0 0 1em; }
.doc table, table.csv { border-collapse: collapse; font-size: 13px; }
.doc th, .doc td, table.csv th, table.csv td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
.doc th, table.csv th { background: var(--raise); font-weight: 600; }
table.csv { font-family: var(--font-code); font-size: 12px; font-variant-numeric: tabular-nums; }
table.csv td.num { text-align: right; color: var(--t-n); }
table.csv tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--raise) 45%, transparent); }

.pv-meta { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
.meta { font-family: var(--font-code); font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--raise); color: var(--muted); white-space: nowrap; }
.meta b { color: var(--fg); font-weight: 500; }
.outline { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; }
.outline button { font-family: var(--font-code); font-size: 11.5px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 8px; cursor: pointer; color: var(--t-f); }
.outline button:hover { border-color: var(--accent); }
.outline button span { color: var(--faint); margin-left: 6px; }
.src { margin: 12px 16px 24px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); overflow-x: auto; font-family: var(--font-code); font-size: 12.5px; line-height: 1.6; }
.src table { border-collapse: collapse; width: 100%; }
.src td { padding: 0 12px; vertical-align: top; white-space: pre; }
.src td.ln { color: var(--faint); text-align: right; user-select: none; width: 1%; padding-right: 8px; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pv-note { padding: 10px 16px 0; color: var(--muted); font-size: 12px; }
.pv-error { margin: 16px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--err) 50%, transparent); border-radius: 6px; color: var(--err); background: color-mix(in srgb, var(--err) 8%, transparent); font-family: var(--font-code); font-size: 12px; white-space: pre-wrap; }
.pv-empty { display: grid; place-content: center; text-align: center; gap: 8px; height: 100%; color: var(--muted); padding: 24px; }

/* notebook */
.nb { padding: 18px 18px 40px; display: flex; flex-direction: column; gap: 10px; max-width: 54rem; margin: 0 auto; }
.nb-cell { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 10px; }
.nb-prompt { font-family: var(--font-code); font-size: 11.5px; color: var(--t-f); text-align: right; padding-top: 9px; white-space: nowrap; }
.nb-prompt.out { color: var(--t-t); }
.nb-in { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; overflow-x: auto; font-family: var(--font-code); font-size: 12.5px; line-height: 1.55; white-space: pre; margin: 0; }
.nb-md { padding: 2px 4px; }
.nb-md.doc { padding: 0 4px; max-width: none; margin: 0; }
.nb-md.doc h1 { margin-top: .2em; }
.nb-out { padding: 6px 2px; overflow-x: auto; font-size: 13px; min-width: 0; }
.nb-out pre { margin: 0; font-family: var(--font-code); font-size: 12.5px; white-space: pre-wrap; }
.nb-out pre.stderr { color: var(--err); background: color-mix(in srgb, var(--err) 8%, transparent); padding: 6px 8px; border-radius: 4px; }
.nb-out table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.nb-out th, .nb-out td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: right; }
.nb-out thead th { border-bottom: 1px solid var(--muted); }
.nb-out img { max-width: 100%; background: #fff; }
.nb-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-left: 74px; color: var(--muted); font-size: 12px; }

/* json + svg */
.json { padding: 12px 16px 32px; font-family: var(--font-code); font-size: 12.5px; line-height: 1.7; }
.json details > summary { cursor: pointer; list-style: none; }
.json details > summary::-webkit-details-marker { display: none; }
.json details > summary::before { content: "\25B8"; display: inline-block; width: 14px; color: var(--muted); }
.json details[open] > summary::before { content: "\25BE"; }
.json .kids { padding-left: 18px; border-left: 1px dashed var(--line); margin-left: 5px; }
.json .leaf { padding-left: 14px; }
.json .jt { color: var(--faint); }
.svg-stage { margin: 16px; border: 1px solid var(--line); border-radius: 6px; padding: 24px; display: grid; place-items: center; min-height: 240px;
  background-color: var(--panel); background-image: linear-gradient(45deg, var(--checker) 25%, transparent 25%, transparent 75%, var(--checker) 75%), linear-gradient(45deg, var(--checker) 25%, transparent 25%, transparent 75%, var(--checker) 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.svg-stage img { max-width: 100%; max-height: 60vh; }

/* windows desktop preview */
.pv-body.win { overflow: hidden; display: flex; flex-direction: column; background: #000; }
.win-bar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.win-bar .meta { background: var(--raise); }
.win-btn { margin-left: auto; font-size: 11px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
.win-btn:hover { border-color: var(--accent); color: var(--accent); }
.win-stage { flex: 1; min-height: 0; position: relative; background: #000; }
.win-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.win-boot { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px; font-family: var(--font-code); font-size: 11px; color: var(--muted); background: linear-gradient(transparent, rgba(0,0,0,.85) 40%); pointer-events: none; }
body.pv-full .work > *:not(#pPreview) { display: none; }
body.pv-full #pPreview { flex: 1 1 auto; }

/* terminals */
.term { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.term-head { background: var(--panel); }
.ttab { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; color: var(--fg); border-right: 1px solid var(--line); position: relative; white-space: nowrap; font-size: 12.5px; }
.term.focused .ttab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.ttab svg { width: 15px; height: 15px; color: var(--muted); }
.ttab .cwdlbl { color: var(--muted); font-family: var(--font-code); font-size: 11px; max-width: 14ch; overflow: hidden; text-overflow: ellipsis; }
.term-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px 14px 14px; font-family: var(--font-code); font-size: var(--code-size); line-height: 1.5; cursor: text; }
.term-out { white-space: pre-wrap; word-break: break-word; }
.term-line { display: flex; align-items: baseline; flex-wrap: wrap; }
.prompt { white-space: pre; }
.prompt .u { color: var(--accent); font-weight: 600; } .prompt .p { color: var(--a34); font-weight: 500; } .prompt .d { color: var(--muted); }
.term-in { flex: 1; min-width: 6ch; background: transparent; border: 0; outline: none; color: var(--fg); font: inherit; padding: 0; caret-color: var(--accent); }
.term-cands { display: flex; flex-wrap: wrap; gap: 2px 18px; color: var(--a36); }
.c30 { color: var(--a30); } .c31 { color: var(--a31); } .c32 { color: var(--a32); } .c33 { color: var(--a33); } .c34 { color: var(--a34); }
.c35 { color: var(--a35); } .c36 { color: var(--a36); } .c37 { color: var(--a37); } .c90 { color: var(--a90); }
.b { font-weight: 600; } .dim { opacity: .7; }
.echo { color: var(--fg); }

/* new-file menu */
.menu { position: fixed; z-index: 50; min-width: 230px; max-height: min(70vh, 520px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
.menu-title { padding: 6px 10px 8px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--raise); outline: none; }
.menu .ext { margin-left: auto; color: var(--faint); font-family: var(--font-code); font-size: 11px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

/* status bar */
.statusbar { display: flex; align-items: center; gap: 16px; height: 24px; padding: 0 12px; flex: none; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; white-space: nowrap; overflow: hidden; }
.statusbar span { overflow: hidden; text-overflow: ellipsis; }
.statusbar .sp { flex: 1; }
.statusbar b { font-weight: 600; }

/* narrow screens: stack the panes and let the page scroll */
@media (max-width: 880px) {
  html, body { height: auto; }
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .work { flex-direction: column; }
  .explorer { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .split, .hsplit { display: none; }
  .p-editor { flex: none; height: 58vh; }
  .p-preview { flex: none; height: 62vh; border-top: 1px solid var(--line); }
  .p-terms { flex: none; height: auto; border-top: 1px solid var(--line); }
  .term { flex: none; height: 46vh; }
  .term + .term { border-top: 1px solid var(--line); }
  .chipline { display: none; }
  .term-in { font-size: 16px; }
  .ed-ta { font-size: 16px; }
  :root { --code-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

/* ---------- C core bridge ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
let W = null;
const mem = () => new Uint8Array(W.memory.buffer);
function putIn(str) {
  const b = enc.encode(str);
  if (b.length > W.in_cap()) throw new Error("File is larger than 512 KB");
  mem().set(b, W.in_ptr());
  return b.length;
}
function putName(str) { const b = enc.encode(str); mem().set(b, W.name_ptr()); return b.length; }
function out(n) { return n < 0 ? null : dec.decode(mem().subarray(W.out_ptr(), W.out_ptr() + n)); }
const C = {
  exec: line => out(W.shell_exec(putIn(line))),
  write: (p, text) => { try { return W.fs_write(putName(p), putIn(text)); } catch (e) { return -1; } },
  read: p => out(W.fs_read(putName(p))),
  mkdir: p => W.fs_mkdir(putName(p)),
  list: () => out(W.fs_list()).split("\n").filter(Boolean).map(l => ({ dir: l[0] === "d", path: l.slice(2) })),
  hl: (text, lang) => out(W.highlight(putIn(text), lang)),
  md: text => out(W.md_render(putIn(text))),
  csv: text => out(W.csv_render(putIn(text))),
  lang: p => W.lang_of_name(putName(p)),
  prompt: () => out(W.prompt()),
  cwd: () => out(W.cwd()),
  complete: line => out(W.complete(putIn(line))),
  motd: () => out(W.motd()),
};
const LANG = { plain: 0, html: 1, css: 2, js: 3, py: 4, c: 5, md: 6, sql: 7, sh: 8 };

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const base = p => p.slice(p.lastIndexOf("/") + 1);
const dirOf = p => p.slice(0, p.lastIndexOf("/")) || "/";
const extOf = p => { const b = base(p), i = b.lastIndexOf("."); return i > 0 ? b.slice(i + 1).toLowerCase() : ""; };
const HOME = "/home/lennon";
const tilde = p => p === HOME ? "~" : p.startsWith(HOME + "/") ? "~" + p.slice(HOME.length) : p;
function normPath(p) {
  const parts = [];
  for (const s of p.split("/")) { if (!s || s === ".") continue; if (s === "..") parts.pop(); else parts.push(s); }
  return "/" + parts.join("/");
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const TYPES = [
  ["html", "HTML page", "<>"], ["css", "CSS stylesheet", "#"], ["js", "JavaScript", "JS"], ["ts", "TypeScript", "TS"],
  ["md", "Markdown", "M↓"], ["ipynb", "Jupyter Notebook", "nb"], ["py", "Python", "py"], ["c", "C", "C"], ["cpp", "C++", "C++"],
  ["json", "JSON", "{}"], ["csv", "CSV table", "csv"], ["svg", "SVG image", "svg"], ["sql", "SQL", "sql"], ["yaml", "YAML", "yml"],
  ["sh", "Shell script", "$_"], ["txt", "Plain text", "txt"], ["win", "Windows desktop", "\u229e"],
];
const BADGE = Object.fromEntries(TYPES.map(t => [t[0], t[2]]));
Object.assign(BADGE, { htm: "<>", h: "h", yml: "yml", jsx: "JSX", tsx: "TSX", xml: "xml" });
const LANGNAME = { html: "HTML", htm: "HTML", css: "CSS", js: "JavaScript", ts: "TypeScript", md: "Markdown", ipynb: "Jupyter Notebook", py: "Python", c: "C", h: "C header", cpp: "C++", json: "JSON", csv: "CSV", svg: "SVG", sql: "SQL", yaml: "YAML", yml: "YAML", sh: "Shell", txt: "Plain text", win: "Windows 11 desktop" };
function badge(path, dir) {
  if (dir) return `<span class="badge b-dir">▸</span>`;
  const e = extOf(path);
  return `<span class="badge b-${esc(e)}">${esc(BADGE[e] || "·")}</span>`;
}

/* ---------- persistence (per viewer, best effort) ---------- */
const KEY = "cterm-studio-v1";
function saveState() {
  try {
    const files = {}, dirs = [];
    for (const n of C.list()) { if (n.dir) dirs.push(n.path); else files[n.path] = C.read(n.path); }
    localStorage.setItem(KEY, JSON.stringify({ files, dirs, tabs: App.tabs, active: App.active, w: App.widths }));
  } catch (e) { /* storage unavailable: work stays in memory */ }
}
const saveSoon = debounce(saveState, 500);
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.files) return null;
    W.fs_clear();
    for (const d of s.dirs || []) C.mkdir(d);
    for (const [p, t] of Object.entries(s.files)) C.write(p, t ?? "");
    return s;
  } catch (e) { return null; }
}

/* ---------- app state ---------- */
const App = {
  tabs: [], active: null, pinned: null, widths: null,
  collapsed: new Set(), terms: [], focusedTerm: 0,
  exists(p) { return C.read(p) !== null; },
  open(p) {
    if (!this.exists(p)) return;
    if (!this.tabs.includes(p)) this.tabs.push(p);
    this.active = p;
    Editor.load(p);
    this.renderTabs(); Explorer.render(); Preview.render();
    saveSoon();
  },
  close(p) {
    const i = this.tabs.indexOf(p);
    if (i < 0) return;
    this.tabs.splice(i, 1);
    if (this.active === p) this.active = this.tabs[Math.min(i, this.tabs.length - 1)] || null;
    if (this.pinned === p) this.pinned = null;
    Editor.load(this.active);
    this.renderTabs(); Explorer.render(); Preview.render(); saveSoon();
  },
  renderTabs() {
    const el = $("#tabs");
    el.innerHTML = this.tabs.map(p => `<div class="tab${p === this.active ? " active" : ""}" role="tab" tabindex="0" aria-selected="${p === this.active}" data-path="${esc(p)}" title="${esc(tilde(p))}">${badge(p)}<span>${esc(base(p))}</span><span class="x" data-close="${esc(p)}" role="button" aria-label="Close ${esc(base(p))}">×</span></div>`).join("");
    const a = el.querySelector(".tab.active");
    if (a) a.scrollIntoView({ block: "nearest", inline: "nearest" });
  },
  /* after any shell command: drop tabs for deleted files, reload changed ones */
  sync() {
    const before = this.tabs.length;
    this.tabs = this.tabs.filter(p => this.exists(p));
    if (this.active && !this.exists(this.active)) this.active = this.tabs[this.tabs.length - 1] || null;
    if (this.pinned && !this.exists(this.pinned)) this.pinned = null;
    if (this.active) { const t = C.read(this.active); if (t !== Editor.ta.value) Editor.load(this.active); }
    else Editor.load(null);
    if (before !== this.tabs.length) this.renderTabs();
    this.renderTabs(); Explorer.render(); Preview.render(); updateStatus(); saveSoon();
  },
  renamed(a, b) {
    const map = p => p === a ? b : p.startsWith(a + "/") ? b + p.slice(a.length) : p;
    this.tabs = this.tabs.map(map);
    if (this.active) this.active = map(this.active);
    if (this.pinned) this.pinned = map(this.pinned);
    Editor.path = this.active;
  },
};

/* ---------- explorer ---------- */
const Explorer = {
  render() {
    const nodes = C.list();
    const kids = new Map();
    for (const n of nodes) { const d = dirOf(n.path); if (!kids.has(d)) kids.set(d, []); kids.get(d).push(n); }
    for (const list of kids.values()) list.sort((x, y) => (y.dir - x.dir) || x.path.localeCompare(y.path));
    let html = "";
    const walk = (dir, depth) => {
      for (const n of kids.get(dir) || []) {
        const open = !App.collapsed.has(n.path);
        const pad = 8 + depth * 14;
        if (n.dir) {
          html += `<button class="tree-row" role="treeitem" aria-expanded="${open}" data-dir="${esc(n.path)}" style="padding-left:${pad}px"><span class="tw">${open ? "▾" : "▸"}</span><span class="nm" style="color:var(--fg);font-weight:500">${esc(base(n.path))}</span></button>`;
          if (open) walk(n.path, depth + 1);
        } else {
          html += `<button class="tree-row${n.path === App.active ? " active" : ""}" role="treeitem" data-file="${esc(n.path)}" style="padding-left:${pad}px"><span class="tw"></span>${badge(n.path)}<span class="nm">${esc(base(n.path))}</span></button>`;
        }
      }
    };
    const rootKids = kids.get(HOME) ? HOME : "/";
    html += `<div class="pane-label" style="height:24px;padding-left:10px">${esc(rootKids === HOME ? "lennon" : "/")}</div>`;
    walk(rootKids, 0);
    if (rootKids === HOME) { for (const top of (kids.get("/") || [])) if (top.path !== "/home") { walk("/", 0); break; } }
    $("#tree").innerHTML = html;
    $("#sbFiles").textContent = nodes.filter(n => !n.dir).length + " files";
  },
};
$("#tree").addEventListener("click", e => {
  const r = e.target.closest(".tree-row"); if (!r) return;
  if (r.dataset.dir) { const p = r.dataset.dir; App.collapsed.has(p) ? App.collapsed.delete(p) : App.collapsed.add(p); Explorer.render(); }
  else App.open(r.dataset.file);
});
$("#tabs").addEventListener("click", e => {
  const x = e.target.closest("[data-close]"); if (x) { e.stopPropagation(); App.close(x.dataset.close); return; }
  const t = e.target.closest(".tab"); if (t) App.open(t.dataset.path);
});
$("#tabs").addEventListener("keydown", e => { if (e.key === "Enter") { const t = e.target.closest(".tab"); if (t) App.open(t.dataset.path); } });
$("#tabs").addEventListener("auxclick", e => { const t = e.target.closest(".tab"); if (t && e.button === 1) App.close(t.dataset.path); });

/* ---------- editor (textarea over C-highlighted layer) ---------- */
const Editor = {
  ta: $("#edTa"), hl: $("#edHl"), gut: $("#gutterInner"), path: null, lang: 0, lines: 0,
  load(p) {
    this.path = p;
    $("#edEmpty").hidden = !!p;
    this.ta.hidden = !p; $("#gutter").hidden = !p; this.hl.parentElement.hidden = !p;
    if (!p) { this.ta.value = ""; updateStatus(); return; }
    this.lang = C.lang(p);
    this.ta.value = C.read(p) ?? "";
    this.ta.scrollTop = 0; this.ta.scrollLeft = 0;
    this.paint(); updateStatus();
  },
  paint() {
    const v = this.ta.value;
    this.hl.innerHTML = C.hl(v, this.lang) + "\n ";
    const n = v.split("\n").length;
    if (n !== this.lines) {
      this.lines = n;
      let s = ""; for (let i = 1; i <= n; i++) s += i + "\n";
      this.gut.textContent = s;
    }
    this.scroll();
  },
  scroll() {
    const t = `translate(${-this.ta.scrollLeft}px, ${-this.ta.scrollTop}px)`;
    this.hl.style.transform = t;
    this.gut.style.transform = `translateY(${-this.ta.scrollTop}px)`;
  },
  changed() {
    if (!this.path) return;
    if (C.write(this.path, this.ta.value) < 0) { $("#sbPos").textContent = "File too large to save"; return; }

    this.out = $(".term-out", this.el); this.input = $(".term-in", this.el); this.body = $(".term-body", this.el); this.pr = $(".prompt", this.el);
    this.hist = []; this.hi = 0; this.draft = "";
    this.body.addEventListener("mousedown", e => { if (e.target === this.body || e.target === this.out) setTimeout(() => { if (!getSelection().toString()) this.input.focus(); }); });
    this.body.addEventListener("click", () => { if (!getSelection().toString()) this.input.focus(); });
    this.input.addEventListener("keydown", e => this.key(e));
    this.input.addEventListener("focus", () => { App.focusedTerm = this.id; App.terms.forEach(t => t.el.classList.toggle("focused", t === this)); updateStatus(); });
    $("[data-clear]", this.el).addEventListener("click", () => { this.clear(); this.input.focus(); });
    if (intro) this.print(intro);
    this.updatePrompt();
  }
  promptHtml() {
    W.set_term(this.id);
    return `<span class="u">lennon@cterm</span><span class="d">:</span><span class="p">${esc(C.prompt())}</span><span class="d">$ </span>`;
  }
  updatePrompt() { this.pr.innerHTML = this.promptHtml(); W.set_term(this.id); $(".cwdlbl", this.el).textContent = C.prompt(); }
  print(text) { this.out.insertAdjacentHTML("beforeend", ansi(text)); this.trim(); this.bottom(); }
  printHtml(h) { this.out.insertAdjacentHTML("beforeend", h); this.trim(); this.bottom(); }
  trim() { while (this.out.childNodes.length > 4000) this.out.firstChild.remove(); }
  bottom() { this.body.scrollTop = this.body.scrollHeight; }
  clear() { this.out.innerHTML = ""; }
  run(line, typed) {
    this.printHtml(`<div>${this.promptHtml()}<span class="echo">${esc(line)}</span></div>`);
    if (line.trim()) { if (this.hist[this.hist.length - 1] !== line) this.hist.push(line); }
    this.hi = this.hist.length; this.draft = "";
    W.set_term(this.id);
    const res = C.exec(line);
    const text = [];
    for (const l of res.split("\n")) {
      if (l.startsWith("\x01")) {
        const sp = l.indexOf(" "), verb = sp < 0 ? l.slice(1) : l.slice(1, sp), arg = sp < 0 ? "" : l.slice(sp + 1);
        if (verb === "open") App.open(arg);
        else if (verb === "preview") { App.pinned = arg; if (!App.tabs.includes(arg)) App.open(arg); else Preview.render(); }
        else if (verb === "clear") { this.clear(); text.length = 0; }
        else if (verb === "winboot") {
          const p = "/home/lennon/project/windows11.win";
          App.pinned = p;
          if (App.exists(p) && !App.tabs.includes(p)) App.open(p); else Preview.render();
        }
        else if (verb === "mv") { const [a, b] = arg.split(" "); App.renamed(a, b); }
        else if (verb === "reset") { App.tabs = []; App.active = null; App.pinned = null; ["index.html", "README.md", "analysis.ipynb"].forEach(f => { const p = "/home/lennon/project/" + f; if (!App.tabs.includes(p)) App.tabs.push(p); }); App.active = App.tabs[0]; Editor.load(App.active); }
      } else text.push(l);
    }
    const s = text.join("\n");
    if (s) this.print(s.endsWith("\n") ? s : s + "\n");
    App.terms.forEach(t => t.updatePrompt());
    App.sync();
    this.bottom();
  }
  key(e) {
    const inp = this.input;
    if (e.key === "Enter") { e.preventDefault(); const v = inp.value; inp.value = ""; this.run(v); }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (this.hi === this.hist.length) this.draft = inp.value; if (this.hi > 0) { this.hi--; inp.value = this.hist[this.hi]; } this.caretEnd(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); if (this.hi < this.hist.length) { this.hi++; inp.value = this.hi === this.hist.length ? this.draft : this.hist[this.hi]; } this.caretEnd(); }
    else if (e.key === "Tab") {
      e.preventDefault();
      W.set_term(this.id);
      const pos = inp.selectionStart, head = inp.value.slice(0, pos), tail = inp.value.slice(pos);
      const r = C.complete(head).split("\n");
      const nv = r[0];
      if (r.length > 1) {
        this.printHtml(`<div>${this.promptHtml()}<span class="echo">${esc(inp.value)}</span></div><div class="term-cands">${r.slice(1).map(c => `<span>${esc(c)}</span>`).join("")}</div>`);
      }
      inp.value = nv + tail; inp.setSelectionRange(nv.length, nv.length);
    }
    else if (e.ctrlKey && e.key.toLowerCase() === "l") { e.preventDefault(); this.clear(); }
    else if (e.ctrlKey && e.key.toLowerCase() === "c" && !getSelection().toString()) {
      e.preventDefault();
      this.printHtml(`<div>${this.promptHtml()}<span class="echo">${esc(inp.value)}</span><span class="c90">^C</span></div>`);
      inp.value = "";
    }
  }
  caretEnd() { const n = this.input.value.length; requestAnimationFrame(() => this.input.setSelectionRange(n, n)); }
  type(cmd) { this.input.value = ""; this.run(cmd); this.input.focus(); }
}

/* ---------- new-file menu ---------- */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(btn) {
  closeMenu();
  const termEl = btn.closest(".term");
  const term = termEl ? App.terms.find(t => t.el === termEl) : App.terms[App.focusedTerm] || App.terms[0];
  menuEl = document.createElement("div");
  menuEl.className = "menu"; menuEl.setAttribute("role", "menu");
  const main = ["html", "css", "js", "ts", "md", "ipynb", "py", "c", "cpp"], data = ["json", "csv", "svg", "sql", "yaml", "sh", "txt"];
  const item = k => { const t = TYPES.find(x => x[0] === k); return `<button role="menuitem" data-type="${k}">${badge("x." + k)}<span>${esc(t[1])}</span><span class="ext">.${k}</span></button>`; };
  menuEl.innerHTML = `<div class="menu-title">New file · runs <span style="font-family:var(--font-code);text-transform:none">new &lt;type&gt;</span></div>${main.map(item).join("")}<hr>${data.map(item).join("")}`;
  document.body.appendChild(menuEl);
  const r = btn.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  menuEl.style.left = Math.max(8, Math.min(innerWidth - mw - 8, r.right - mw)) + "px";
  menuEl.style.top = (r.bottom + mh + 8 > innerHeight ? Math.max(8, r.top - mh - 4) : r.bottom + 4) + "px";
  menuEl.addEventListener("click", e => { const b = e.target.closest("[data-type]"); if (!b) return; closeMenu(); term.type("new " + b.dataset.type); });
  menuEl.querySelector("button").focus();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-newmenu]");
  if (b) { e.stopPropagation(); menuEl ? closeMenu() : openMenu(b); return; }
  if (menuEl && !menuEl.contains(e.target)) closeMenu();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.body.classList.contains("pv-full")) {
    document.body.classList.remove("pv-full");
    const b = document.getElementById("winFull"); if (b) b.textContent = "Fill the window";
  }
  if (e.key === "Escape") closeMenu();
  if (menuEl && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const items = [...menuEl.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
  }
});

/* ---------- splitters ---------- */
function setupSplits() {
  const panes = [$("#pEditor"), $("#pPreview"), $("#pTerms")];
  const apply = w => panes.forEach((p, i) => p.style.flex = `${w[i]} 1 0`);
  if (App.widths) apply(App.widths);
  document.querySelectorAll(".split").forEach(sp => {
    sp.addEventListener("pointerdown", e => {
      const i = +sp.dataset.split, a = panes[i], b = panes[i + 1];
      const wa = a.getBoundingClientRect().width, wb = b.getBoundingClientRect().width, x0 = e.clientX;
      const total = panes.reduce((s, p) => s + p.getBoundingClientRect().width, 0);
      sp.setPointerCapture(e.pointerId); sp.classList.add("drag");
      const move = ev => {
        const dx = Math.max(140 - wa, Math.min(wb - 140, ev.clientX - x0));
        const w = panes.map(p => p.getBoundingClientRect().width / total);
        w[i] = (wa + dx) / total; w[i + 1] = (wb - dx) / total;
        App.widths = w.map(x => +x.toFixed(4)); apply(App.widths);
      };
      const up = () => { sp.classList.remove("drag"); sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); saveSoon(); Editor.scroll(); };
      sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up);
    });
  });
}
function setupHSplit() {
  const [t1, t2] = App.terms.map(t => t.el);
  const hs = document.createElement("div");
  hs.className = "hsplit"; hs.setAttribute("role", "separator"); hs.setAttribute("aria-orientation", "horizontal");
  t1.after(hs);
  hs.addEventListener("pointerdown", e => {
    const h1 = t1.getBoundingClientRect().height, h2 = t2.getBoundingClientRect().height, y0 = e.clientY;
    hs.setPointerCapture(e.pointerId); hs.classList.add("drag");
    const move = ev => { const dy = Math.max(80 - h1, Math.min(h2 - 80, ev.clientY - y0)); t1.style.flex = `${h1 + dy} 1 0`; t2.style.flex = `${h2 - dy} 1 0`; };
    const up = () => { hs.classList.remove("drag"); hs.removeEventListener("pointermove", move); hs.removeEventListener("pointerup", up); };
    hs.addEventListener("pointermove", move); hs.addEventListener("pointerup", up);
  });
}

/* ---------- boot ---------- */
(async function boot() {
  const bytes = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
  const { instance } = await WebAssembly.instantiate(bytes, {
    env: {
      js_date(kind, ptr, cap) {
        const d = new Date();
        const p2 = n => String(n).padStart(2, "0");
        const s = kind === 1 ? `${p2(d.getMonth() + 1)}/${p2(d.getDate())}/${d.getFullYear()}`
          : kind === 2 ? d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" })
          : d.toLocaleString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
        const b = enc.encode(s).subarray(0, cap);
        mem().set(b, ptr); return b.length;
      },
    },
  });
  W = instance.exports;
  W.init();
  const saved = loadState();
  if (window.matchMedia("(max-width: 880px)").matches) $("#explorer").hidden = true, $("#toggleExplorer").setAttribute("aria-pressed", "false");
  $("#coreInfo").innerHTML = `C core <b>${(bytes.length / 1024).toFixed(0)} KB</b> wasm32 · editor, preview and shell all call into csh.c`;

  App.terms.push(new Term(0, "csh", C.motd()));
  App.terms.push(new Term(1, "csh · 2", "\x1b[90mSecond shell. Same files, its own folder and history.\x1b[0m\n"));
  setupHSplit();
  if (saved) { App.widths = saved.w || null; }
  setupSplits();

  const proj = "/home/lennon/project/";
  const want = saved?.tabs?.length ? saved.tabs : [proj + "index.html", proj + "README.md", proj + "analysis.ipynb"];
  App.tabs = want.filter(p => App.exists(p));
  App.active = saved?.active && App.exists(saved.active) ? saved.active : App.tabs[0] || null;
  Editor.load(App.active);
  App.renderTabs(); Explorer.render(); Preview.render(); updateStatus();
  App.terms[1].run("ls -l");
  App.terms[0].input.focus({ preventScroll: true });
  App.terms[0].el.classList.add("focused");
})().catch(err => {
  document.body.insertAdjacentHTML("afterbegin", `<div class="pv-error">The C core failed to start: ${esc(err.message)}</div>`);
});
